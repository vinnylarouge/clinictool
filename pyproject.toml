[project]
name = "pullback"
version = "0.0.1"
description = "A per-case medication suitability workbench for one UK clinician. Research aid, not a recommender."
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pullback = "pullback.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pullback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
